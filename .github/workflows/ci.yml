name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Script-tag bundle and SRI
        run: pnpm --filter @fusescope/browser test:dist
      - name: Bundle-size budget
        run: pnpm --filter @fusescope/browser size
      - name: Licence check (production dependencies)
        run: |
          node --test scripts/licenses.test.mjs
          for pkg in browser cli; do
            pnpm licenses list --prod --json --filter "@fusescope/$pkg" | node scripts/licenses.mjs
          done
      - name: CLI smoke test
        run: node packages/cli/dist/bin.js --help
      - name: CVE scan (production dependencies)
        run: pnpm audit --prod --audit-level low

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fusescope/browser exec playwright install --with-deps chromium
      - run: pnpm --filter @fusescope/browser test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/browser/test-results/
          retention-days: 7

  sbom:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [browser, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ./scripts/sbom.sh ${{ matrix.package }} "$PWD/sbom-${{ matrix.package }}.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.package }}-cyclonedx
          path: sbom-${{ matrix.package }}.cdx.json
