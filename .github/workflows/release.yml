name: release

# Manual only. Publishing stays off until the npm org and trusted publishing are
# set up: see "Releasing" in packages/browser/README.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (also needs the NPM_PUBLISH_ENABLED variable set to true)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  browser:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm --filter @fusescope/browser size
      - run: pnpm licenses list --prod --json --filter @fusescope/browser | node scripts/licenses.mjs
      - run: pnpm audit --prod --audit-level low
      - name: SRI hashes
        run: node scripts/sri.mjs packages/browser/dist | tee -a "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/sbom.sh "$PWD/sbom-browser.cdx.json"
      - name: Pack
        working-directory: packages/browser
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
      - name: Dist-tag
        id: dist
        working-directory: packages/browser
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with dist-tag $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (dry run)
        working-directory: packages/browser
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public --tag "${{ steps.dist.outputs.tag }}" --dry-run
      - name: Publish
        if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true'
        working-directory: packages/browser
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser
          path: |
            ${{ runner.temp }}/pkg/*.tgz
            packages/browser/dist/sri.json
            sbom-browser.cdx.json
