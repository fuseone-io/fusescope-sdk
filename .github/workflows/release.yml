name: release

# Manual only. Publishes through npm trusted publishing (OIDC). A brand-new package can't have a
# trusted publisher yet, so its first version uses `bootstrap` with a short-lived NPM_TOKEN secret,
# which is deleted (and the token revoked) right after.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        options: [browser, cli]
        default: browser
      publish:
        description: Publish to npm (also needs the NPM_PUBLISH_ENABLED variable set to true)
        type: boolean
        default: false
      bootstrap:
        description: First publish of a new package, with the short-lived NPM_TOKEN secret instead of OIDC
        type: boolean
        default: false
      promote_latest:
        description: Point the latest dist-tag at this package.json version (after publishing, or alone)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: release @fusescope/${{ inputs.package }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      PKG: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - if: inputs.package == 'browser'
        run: pnpm --filter @fusescope/browser test:dist && pnpm --filter @fusescope/browser size
      - run: pnpm licenses list --prod --json --filter "@fusescope/$PKG" | node scripts/licenses.mjs
      - run: pnpm audit --prod --audit-level low
      - name: SRI hash
        if: inputs.package == 'browser'
        working-directory: packages/browser
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo '## Script tag'
            echo
            echo '```html'
            echo "<script src=\"https://cdn.jsdelivr.net/npm/@fusescope/browser@$version/dist/fusescope.min.js\" integrity=\"$(cat dist/fusescope.min.js.sri)\" crossorigin=\"anonymous\"></script>"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: ./scripts/sbom.sh "$PKG" "$PWD/sbom-$PKG.cdx.json"
      - name: Pack
        working-directory: packages/${{ inputs.package }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
      - name: Dist-tag
        id: dist
        working-directory: packages/${{ inputs.package }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @fusescope/$PKG $version with dist-tag $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (dry run)
        working-directory: packages/${{ inputs.package }}
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public --tag "${{ steps.dist.outputs.tag }}" --dry-run
      - name: Publish
        if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true'
        working-directory: packages/${{ inputs.package }}
        env:
          BOOTSTRAP_TOKEN: ${{ inputs.bootstrap && secrets.NPM_TOKEN || '' }}
        run: |
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            npmrc="$RUNNER_TEMP/bootstrap.npmrc"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$BOOTSTRAP_TOKEN" > "$npmrc"
            export NPM_CONFIG_USERCONFIG="$npmrc"
          fi
          npm publish "$RUNNER_TEMP"/pkg/*.tgz --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
      # Versions are immutable: an existing key fails the run instead of being overwritten.
      - name: Upload to CDN (Cloudflare R2)
        if: inputs.package == 'browser' && inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true'
        working-directory: packages/browser/dist
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ vars.R2_BUCKET || 'fusescope-cdn' }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::R2 secrets not set; CDN upload skipped"
            echo "CDN upload skipped: R2 secrets not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -p "require('../package.json').version")
          prefix="browser/$version"
          r2() { aws s3api --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          for file in fusescope.min.js fusescope.min.js.map fusescope.min.js.sri; do
            if out=$(r2 head-object --bucket "$R2_BUCKET" --key "$prefix/$file" 2>&1); then
              echo "::error::$R2_BUCKET/$prefix/$file already exists; CDN versions are immutable"
              exit 1
            elif ! grep -q '(404)' <<<"$out"; then
              echo "$out" >&2
              exit 1
            fi
          done
          upload() {
            r2 put-object --bucket "$R2_BUCKET" --key "$prefix/$1" --body "$1" --content-type "$2" \
              --cache-control 'public, max-age=31536000, immutable' > /dev/null
          }
          upload fusescope.min.js.map application/json
          upload fusescope.min.js.sri text/plain
          upload fusescope.min.js application/javascript
          echo "CDN: \`$R2_BUCKET/$prefix/fusescope.min.js\` (https://cdn.fuseone.io/$prefix/fusescope.min.js)" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote to latest
        if: inputs.promote_latest && vars.NPM_PUBLISH_ENABLED == 'true'
        working-directory: packages/${{ inputs.package }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm dist-tag add "@fusescope/$PKG@$version" latest
          echo "latest → @fusescope/$PKG@$version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.package }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pkg/*.tgz
            packages/browser/dist/fusescope.min.js*
            sbom-${{ inputs.package }}.cdx.json
